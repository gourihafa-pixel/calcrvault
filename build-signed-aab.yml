name: Build Signed AAB for Google Play

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          printf "storeFile=$(pwd)/keystore.jks\nstorePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\n" > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed AAB
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.2'
          arguments: bundleRelease --no-daemon
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Verify AAB exists
        run: |
          ls -lh app/build/outputs/bundle/release/

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorVault-Signed-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
